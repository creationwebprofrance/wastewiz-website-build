            }

        observer.observe(document.body, { childList: true, subtree: true });
        removeBadge();
      })();

<script>
function hideElfsightBadge(root = document) {
    root.querySelectorAll('a[data-state="closed"]').forEach(el => {
        const inner = el.querySelector('div[title="Remove Elfsight branding"]');
        if (inner && el.style.display !== 'none') {
            el.style.setProperty('display', 'none', 'important');
        }
    });

    root.querySelectorAll('*').forEach(el => {
        if (el.shadowRoot) {
            hideElfsightBadge(el.shadowRoot);
        }
    });
}

// Tourne en continu, toutes les 500ms, sans jamais s'arrêter
setInterval(() => hideElfsightBadge(), 500);
</script>
